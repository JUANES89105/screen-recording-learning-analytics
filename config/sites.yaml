# Site dictionary used by the rule-based classifier.
#
# Classification will use weighted evidence:
# - strong_patterns = high-confidence evidence, typically domains or distinctive identifiers.
# - patterns = weaker contextual evidence.
#
# Researchers adapting the pipeline should edit this YAML, not the classifier code.

text_column: texto_ocr_nuevo
residual_category: Otro sitio

scoring:
  strong_weight: 10
  pattern_weight: 1
  minimum_score: 1

