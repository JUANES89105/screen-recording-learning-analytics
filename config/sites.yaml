# ============================================================
# SCREEN-RECORDING CLASSIFICATION CONFIGURATION
# ============================================================
#
# This file is the source of truth for the classification scheme.
# Researchers adapting the pipeline should edit this YAML rather
# than modifying the Python classification code.
#
# The configuration reproduces the final nine-category scheme
# used in the study.
# ============================================================

text_column: texto_ocr_nuevo
historical_column: palabra_base

residual_category: Otro sitio

# ------------------------------------------------------------
# Optional corpus-specific controls.
# These verify reproduction of the study corpus but do not
# define the classification algorithm itself.
# ------------------------------------------------------------

study:
  expected_segments: 18829
  expected_videos: 100

# ------------------------------------------------------------
# Weighted classifier
# ------------------------------------------------------------

scoring:
  strong_weight: 10
  pattern_weight: 1
  minimum_score: 1

# ------------------------------------------------------------
# FINAL CATEGORIES
#
# YAML order also defines precedence when otherwise required.
# ------------------------------------------------------------

categories:

  Quinan:
    historical_labels:
      - quinan

    strong_patterns:
      - aulavirtual.quinan.cl
      - aulavirtualquinan.cl
      - mod/quiz/attempt.php
      - mod/quiz/review.php
      - mod/quiz/summary.php

    patterns:
      - quinan
      - aula virtual
      - aulavirtual
      - mis cursos
      - area personal
      - tiempo restante
      - finalizar intento
      - enviar todo y terminar


  GeoGebra:
    historical_labels:
      - geogebra

    strong_patterns:
      - geogebra.org
      - geogebra.org/calculator
      - geogebra classic
      - graphing calculator geogebra

    patterns:
      - geogebra
      - geogebra classic
      - graphing calculator geogebra


  Google:
    historical_labels:
      - google

    strong_patterns:
      - google.com
      - google.cl

    patterns:
      - google
      - google search
      - buscar con google


  Google (Mat):
    derived_from: Google

    derivation:
      type: term_evidence

      terms:
        - funcion
        - funciones
        - funcion lineal
        - funcion afin
        - funcion cuadratica
        - lineal
        - lineales
        - afin
        - afines
        - cuadratica
        - ecuacion
        - ecuaciones
        - sistema de ecuaciones
        - sistemas de ecuaciones
        - geometria
        - triangulo
        - triangulo equilatero
        - cuadrado
        - rectangulo
        - area
        - perimetro
        - pendiente
        - vertice
        - parabola
        - grafica
        - grafico
        - graficar
        - dominio
        - recorrido
        - variable independiente
        - variable dependiente
        - matematica
        - matematicas
        - calcular
        - calculator


  Wikipedia:
    strong_patterns:
      - wikipedia.org
      - es.wikipedia.org
      - eswikipedia.org
      - esavikipedia.org
      - esmikipedia.org
      - eswvikipedia.org
      - jeswikipedia.org
      - wikipedia, la enciclopedia
      - la enciclopedia libre

    patterns:
      - wikipedia
      - wikipedia, la enciclopedia
      - la enciclopedia libre


  YouTube:
    strong_patterns:
      - youtube.com/watch
      - youtube.com/shorts
      - youtube.com/?
      - youtube.com/results
      - youtu.be/

    patterns:
      - youtube
      - suscribirse
      - visualizaciones


  Juegos:
    strong_patterns:
      - poki.com
      - friv.com
      - friv.co
      - minijuegos.com
      - crazygames.com
      - coolmathgames.com
      - es.y8.com
      - esy8.com
      - y8.com
      - amogus.io
      - classic.minecraft.net

    patterns:
      - poki
      - friv
      - minijuegos
      - crazygames
      - coolmathgames
      - minecraft
      - roblox
      - fireboy


  Screen Recorder:
    strong_patterns:
      - recorder.easeus.com/es/grabador-de-pantalla
      - recorder.caseus.com/es/grabador-de-pantalla
      - recorder.esseus.com/es/grabador-de-pantalla
      - recorder.aseus.com/es/grabador-de-pantalla
      - grabador de pantalla gratis online
      - free online screen recorder
      - online-screen-recorder-brand

    patterns:
      - grabador de pantalla gratis online
      - free online screen recorder
      - online-screen-recorder-brand
      - screen recorder
      - grabador de pantalla
      - easeus


  Otro sitio:
    residual: true


# ------------------------------------------------------------
# HISTORICAL REFINEMENT
#
# These settings describe how the historical first-stage labels
# are treated during reproduction of the study.
# ------------------------------------------------------------

refinement:

  preserve_historical:
    - Quinan
    - GeoGebra

  historical_derived_rule:
    category: Google

  refine_residual_from:
    - Otro sitio

  residual_priority:
    - Wikipedia
    - YouTube
    - Juegos
    - GeoGebra
    - Quinan
    - Screen Recorder

  review_if_detected:
    - Quinan

  historical_to_residual:
    chatgpt:
      category: Otro sitio
      requires_review: true
      reason: >
        ChatGPT was present in the initial historical classification
        but is not part of the final nine-category scheme.

# ------------------------------------------------------------
# PRIVACY-SAFE PUBLIC REPRODUCTION
#
# OCR text and screenshots are restricted. The public refinement
# input therefore stores only category-level evidence flags derived
# with the strong patterns above. These settings map those flags to
# the same historical refinement, temporal, and review procedure.
# ------------------------------------------------------------

public_reproduction:
  evidence_columns:
    Wikipedia: evidence_wikipedia
    YouTube: evidence_youtube
    Juegos: evidence_juegos
    GeoGebra: evidence_geogebra
    Quinan: evidence_quinan
    Screen Recorder: evidence_screen_recorder

  evidence_methods:
    Wikipedia: strong_wikipedia_evidence
    YouTube: strong_youtube_evidence
    Juegos: strong_game_domain
    GeoGebra: strong_geogebra_evidence
    Quinan: possible_quinan
    Screen Recorder: strong_screen_recorder_page

  matched_math_terms_column: matched_math_terms
  episode_gap_seconds: 3
  temporal_max_duration_seconds: 30
